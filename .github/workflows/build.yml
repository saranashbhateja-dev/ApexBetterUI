name: Build Apex OS APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install

      - name: Prepare APK web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html styles.css app.js sync-client.js supabase-config.js source-project-details.js university-admissions-source-data.js manifest.webmanifest www/
          python - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          # Capacitor packages the frontend in a native WebView; do not register the browser service worker.
          s = s.replace(
              "window.ApexAndroid = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());",
              "window.ApexAndroid = true;"
          )
          s = s.replace(
              "if (!window.ApexAndroid && 'serviceWorker' in navigator",
              "if (!window.ApexAndroid && 'serviceWorker' in navigator"
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-OS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
